<!-- Update Opportunity -->
<template>
    <template lwc:if={recordId}>
        <c-record-form object-api-name="Opportunity" record-id={recordId}>
            <c-record-form-field field="OwnerId"></c-record-form-field>
            <c-record-form-field field="IsPrivate"></c-record-form-field>
            <c-record-form-field field="Amount"></c-record-form-field>
            <c-record-form-field field="CloseDate"></c-record-form-field>
            <c-record-form-field field="NextStep"></c-record-form-field>
            <c-record-form-field field="StageName"></c-record-form-field>
            <c-record-form-file-upload multiple show-existing-attachments></c-record-form-file-upload>
            <c-record-form-record-json></c-record-form-record-json>
        </c-record-form>
    </template>
    <template lwc:elseif={errorMessage}>
        <div class="slds-text-color_error" role="alert">{errorMessage}</div>
    </template>
    <template lwc:else>
        <lightning-spinner alternative-text="Loading Opportunity"></lightning-spinner>
    </template>
</template>
