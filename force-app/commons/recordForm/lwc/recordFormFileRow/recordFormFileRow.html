<template>
    <lightning-layout vertical-align="center" class="slds-p-around_small slds-border_bottom">
        <lightning-layout-item size="6">
            <div class="slds-media slds-media_center">
                <div aria-hidden="true" class="slds-media__figure">
                    <lightning-icon
                      icon-name={iconName}
                      size="medium"
                      variant="inverse"
                      alternative-text={iconName}
                    ></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <div class="slds-truncate">
                        <a lwc:if={fileUrl} href={fileUrl} title={file.title} onclick={handleOpenFile}>{file.title}</a>
                        <span lwc:else>{file.title}</span>
                    </div>
                    <span class="slds-text-color_weak slds-text-body_small">{sizeLabel}</span>
                </div>
            </div>
        </lightning-layout-item>

        <lightning-layout-item size="5" class="slds-p-horizontal_small">
            <lightning-progress-bar
                value={progress}
                size="medium"
                variant="circular"
                aria-label={progressLabel}
            ></lightning-progress-bar>
        </lightning-layout-item>

        <lightning-layout-item size="1" class="slds-text-align_center" aria-live="polite" aria-atomic="true">
            <lightning-icon
                lwc:if={isComplete}
                icon-name="utility:success"
                size="small"
                variant="success"
                alternative-text="Upload complete"
            ></lightning-icon>
            <lightning-icon
                lwc:if={isFailed}
                icon-name="utility:error"
                size="small"
                variant="error"
                alternative-text="Upload failed"
                title={errorMessage}
            ></lightning-icon>
            <lightning-button-icon
                lwc:if={isNew}
                icon-name="utility:close"
                variant="bare"
                title="Remove file"
                alternative-text="Remove file"
                onclick={handleRemove}
            ></lightning-button-icon>
        </lightning-layout-item>
    </lightning-layout>
</template>
