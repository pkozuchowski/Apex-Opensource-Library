<template>
    <div class="slds-grid slds-grid_vertical-align-center slds-p-around_small slds-border_bottom">
        <div class="slds-size_6-of-12">
            <div class="slds-media slds-media_center">
                <div aria-hidden="true" class="slds-media__figure">
                    <span class={iconContainerClass}>
                        <lightning-icon
                            icon-name={iconName}
                            size="small"
                            variant="inverse"
                            alternative-text={iconName}
                        ></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <div class="slds-truncate" title={fileName}>{fileName}</div>
                    <span class="slds-text-color_weak slds-text-body_small">{sizeLabel}</span>
                </div>
            </div>
        </div>
        <div class="slds-col slds-size_5-of-12 slds-p-horizontal_small">
            <lightning-progress-bar
                value={file.progress}
                size="medium"
                variant="circular"
                aria-label={progressLabel}
            ></lightning-progress-bar>
        </div>
        <div class="slds-size_1-of-12 slds-text-align_center" aria-live="polite" aria-atomic="true">
            <lightning-icon
                lwc:if={isComplete}
                icon-name="utility:success"
                size="small"
                variant="success"
                alternative-text="Upload complete"
            ></lightning-icon>
            <lightning-button-icon
                lwc:elseif={showRemoveButton}
                icon-name="utility:close"
                variant="bare"
                title="Remove file"
                alternative-text="Remove file"
                onclick={handleRemove}
            ></lightning-button-icon>
        </div>
    </div>
</template>
