<template>
    <lightning-card title="Record Form Change Events" icon-name="standard:account">
        <div class="slds-p-horizontal_medium">
            <p class="slds-m-bottom_small">
                Change a field to update the full record below. The form emits the same full-record payload when saved
                or when a field is removed.
            </p>
            <c-record-form object-api-name="Account" record={account} edit-mode onchange={handleRecordChange}>
                <c-record-form-field field="Name"></c-record-form-field>
                <c-record-form-field field="Website"></c-record-form-field>
                <c-record-form-field field="Type"></c-record-form-field>
                <c-record-form-field field="BillingAddress"></c-record-form-field>
                <c-record-form-record-json></c-record-form-record-json>
            </c-record-form>
        </div>
    </lightning-card>
</template>
