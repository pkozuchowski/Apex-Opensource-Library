<!-- Record Form Field Edit Trigger -->
<template>
    <button
        class="slds-button slds-button_icon slds-shrink-none slds-m-bottom_x-small"
        title={title}
        onclick={handleClick}
    >
        <lightning-icon icon-name="utility:edit" size="xx-small" alternative-text={title}></lightning-icon>
        <span class="slds-assistive-text">{title}</span>
    </button>
</template>
