<!-- Record Form Address -->
<template>
    <c-record-form-field-label lwc:if={isReadOnly} label={addressLabel}>
        <lightning-formatted-address locale={locale} lwc:spread={values}></lightning-formatted-address>
    </c-record-form-field-label>

    <lightning-input-address lwc:else
                             lwc:ref="input"
                             onchange={handleFieldChange}
                             address-label={addressLabel}
                             address-lookup-label={addressLookupLabel}
                             address-lookup-placeholder={addressLookupPlaceholder}
                             city-label={cityLabel}
                             city-placeholder={cityPlaceholder}
                             country-disabled={countryDisabled}
                             country-label={countryLabel}
                             country-lookup-filter={countryLookupFilter}
                             country-options={countryOptions}
                             country-placeholder={countryPlaceholder}
                             disabled={disabled}
                             field-level-help={fieldLevelHelp}
                             hide-province={hideProvince}
                             locale={locale}
                             postal-code-label={postalCodeLabel}
                             postal-code-placeholder={postalCodePlaceholder}
                             province-label={provinceLabel}
                             province-options={provinceOptions}
                             province-placeholder={provincePlaceholder}
                             read-only={isReadOnly}
                             required={required}
                             show-address-lookup={showAddressLookup}
                             show-compact-address={showCompactAddress}
                             street-label={streetLabel}
                             street-placeholder={streetPlaceholder}
                             validity={validity}
                             variant={inputVariant}
                             lwc:spread={values}
    ></lightning-input-address>
</template>
