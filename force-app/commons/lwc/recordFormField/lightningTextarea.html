<template>
    <c-record-form-field-label lwc:if={isReadOnly} label={inputProps.label}>
        <lightning-formatted-text value={inputProps.value}></lightning-formatted-text>
    </c-record-form-field-label>

    <lightning-textarea
            lwc:else
            lwc:ref="input"
            autocomplete={autocomplete}
            disabled={disabled}
            field-level-help={fieldLevelHelp}
            label={label}
            max-length={maxLength}
            message-when-bad-input={messageWhenBadInput}
            message-when-too-long={messageWhenTooLong}
            message-when-too-short={messageWhenTooShort}
            message-when-value-missing={messageWhenValueMissing}
            min-length={minLength}
            placeholder={placeholder}
            read-only={isReadOnly}
            required={required}
            validity={validity}
            value={value}
            variant={inputVariant}
            onchange={handleFieldChange}></lightning-textarea>
</template>
