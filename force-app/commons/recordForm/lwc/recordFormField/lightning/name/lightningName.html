<template>
    <c-record-form-field-output
            lwc:if={isReadOnly}
            label={label}
            density={formAttributes.density}
            show-edit-trigger={showInlineEditTrigger}
    >
        <lightning-formatted-text value={nameValue}></lightning-formatted-text>
    </c-record-form-field-output>

    <div lwc:else onchange={handleFieldChange}>
        <lightning-select lwc:ref="salutation" lwc:spread={salutationAttributes}></lightning-select>
        <lightning-input lwc:ref="firstName" lwc:spread={firstNameAttributes}></lightning-input>
        <lightning-input lwc:ref="lastName" lwc:spread={lastNameAttributes}></lightning-input>
    </div>
</template>
