<template>
    <c-record-form-field-output
            lwc:if={isReadOnly}
            label={label}
            density={formAttributes.density}
            show-edit-trigger={showInlineEditTrigger}
    >
        <lightning-formatted-text value={attributes.value}></lightning-formatted-text>
    </c-record-form-field-output>

    <lightning-input
            lwc:else
            lwc:ref="input"
            lwc:spread={attributes}
            class={classes}
            onchange={handleFieldChange}
    ></lightning-input>
</template>
